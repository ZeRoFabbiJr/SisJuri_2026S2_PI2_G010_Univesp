# CONFIGURAÇÃO NGINX UNPRIVILEGED COM PROTEÇÃO CONTRA SCANNERS (SISTEMA JURÍDICO)
server {
    listen 8080;
    server_name sistema-juridico.cloud www.sistema-juridico.cloud srv2009469.hstgr.cloud localhost;

    # Ocultar versão do Nginx nos cabeçalhos
    server_tokens off;

    # Cabeçalhos de Segurança
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # 1. TRATAMENTO DE REQUISIÇÕES PADRÃO (FAVICON E ROBOTS)
    # Evita erros no log e retorna 404 limpo caso o arquivo não exista fisicamente
    location = /favicon.ico {
        root /usr/share/nginx/html;
        log_not_found off;
        access_log off;
        try_files $uri =404;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        log_not_found off;
        access_log off;
        try_files $uri =404;
    }

    # 2. BLOQUEIO DE VARREDURAS AUTOMATIZADAS / WORDPRESS / ARQUIVOS SENSÍVEIS
    # Retorna 404 imediato sem passar pelo fallback do index.html da SPA e desativa o access_log
    location ~* ^/(wp-admin|wp-includes|wp-content|wp-login\.php|wordpress|xmlrpc\.php|admin|phpmyadmin|pma|console|cgi-bin) {
        access_log off;
        log_not_found off;
        return 404;
    }

    # Bloqueio por extensão de arquivo não suportado (.php, .env, .git, .sql, etc.)
    location ~* \.(php|asp|aspx|jsp|cgi|env|git|htaccess|sql|bak|log|ini|sh|yml|yaml)$ {
        access_log off;
        log_not_found off;
        return 404;
    }

    # 3. ROTA DE API (REDIRECIONAMENTO PARA O BACKEND FASTAPI)
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 4. ROTA PRINCIPAL DA SPA (SINGLE PAGE APPLICATION)
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
