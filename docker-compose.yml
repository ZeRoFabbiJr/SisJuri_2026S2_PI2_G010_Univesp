# ==============================================================================
# DOCKER COMPOSE COM TRAEFIK REVERSE PROXY - PRODUÇÃO VPS HOSTINGER
# Domínio: sistema-juridico.cloud / www.sistema-juridico.cloud 
# Repositório: https://github.com/ZeRoFabbiJr/SisJuri_2026S2_PI2_G010_Univesp
# ==============================================================================

#version: "3.8"

services:
  postgres_db:
    image: postgres:16-alpine
    container_name: sistema_juridico_db
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-sistema_juridico}
      POSTGRES_USER: ${POSTGRES_USER:-juridico_prod_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - juridico_postgres_data:/var/lib/postgresql/data
    networks:
      - backend_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-juridico_prod_user} -d ${POSTGRES_DB:-sistema_juridico}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./BackEnd
      dockerfile: Dockerfile
    container_name: sistema_juridico_backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-juridico_prod_user}:${POSTGRES_PASSWORD}@postgres_db:5432/${POSTGRES_DB:-sistema_juridico}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-60}
      CNJ_API_KEY: ${CNJ_API_KEY}
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - backend_net
      - frontend_net

  frontend:
    build:
      context: ./FrontEnd
      dockerfile: Dockerfile
    container_name: sistema_juridico_frontend
    restart: always
    depends_on:
      - backend
    networks:
      - frontend_net
      - host  #traefik-net: Conteiner traefik-traefik-1
    labels:
      - "traefik.enable=true"
      # Roteamento do Domínio Final sistema-juridico.cloud e www.sistema-juridico.cloud
      - "traefik.http.routers.sisjuri.rule=Host(`sistema-juridico.cloud`) || Host(`www.sistema-juridico.cloud`)"
      - "traefik.http.routers.sisjuri.entrypoints=web,websecure"
      - "traefik.http.routers.sisjuri.tls=true"
      - "traefik.http.routers.sisjuri.tls.certresolver=letsencrypt"
      - "traefik.http.services.sisjuri.loadbalancer.server.port=8080"

networks:
  backend_net:
    driver: bridge
    internal: true
  frontend_net:
    driver: bridge
  host:
    external: true

volumes:
  juridico_postgres_data:
    driver: local
